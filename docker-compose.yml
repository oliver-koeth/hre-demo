services:
  auth-module-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth-module-api
    command: ["dotnet", "run", "--no-launch-profile", "--project", "src/AuthModule/ServiceHost/ServiceHost.csproj", "--urls", "http://0.0.0.0:8080"]
    restart: "no"
    networks:
      - foundation-internal
    volumes:
      - foundation-data:/data
      - ./config:/config:ro
      - ./secrets:/run/secrets:ro
    environment:
      - POLICY_CONFIG_PATH=/config/policy.template.json
    ports:
      - "8080:8080"

  backup-scheduler:
    image: alpine:3.20.3
    container_name: foundation-backup-scheduler
    command: ["/bin/sh", "-c", "while true; do /scripts/backup.sh; sleep 3600; done"]
    restart: "no"
    depends_on:
      - auth-module-api
    networks:
      - foundation-internal
    volumes:
      - foundation-data:/data:ro
      - ./scripts:/scripts:ro
      - ./backups:/backups

networks:
  foundation-internal:
    driver: bridge

volumes:
  foundation-data:
